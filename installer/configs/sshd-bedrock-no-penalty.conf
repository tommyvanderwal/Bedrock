# Bedrock cluster: paramiko probes from peer mgmt nodes hit the SSH
# server frequently. PerSourcePenalties (OpenSSH 9.8+) treats this burst
# like a brute-force attempt and locks out the source IP for up to 10
# minutes after a single LoginGraceTime trip — nodes then flap Offline
# on every dashboard.
#
# Cluster traffic is between authenticated peers (cluster.key + Ed25519
# inter-node API auth + operator-approved join handshake); sshd's
# PerSourcePenalties is a defence against anonymous brute-force and is
# the wrong tool for this surface.
PerSourcePenalties no
