<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5">
  <rect width="900" height="430" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="700" fill="#111">Why two nodes can never both write the arbiter (defence in depth)</text>
  <text x="450" y="46" text-anchor="middle" font-size="11" fill="#777">a write must pass through ALL four gates; a partition closes at least one on every node but the single winner</text>

  <defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker></defs>

  <!-- the attacker -->
  <rect x="30" y="180" width="120" height="60" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="90" y="205" text-anchor="middle" font-weight="700" fill="#b91c1c">a minority</text>
  <text x="90" y="223" text-anchor="middle" font-weight="700" fill="#b91c1c">node's write</text>

  <!-- gate 1 -->
  <rect x="180" y="90" width="150" height="240" rx="8" fill="#eef4fb" stroke="#a9c9ef"/>
  <text x="255" y="116" text-anchor="middle" font-weight="700" fill="#1d4ed8">Gate 1</text>
  <text x="255" y="134" text-anchor="middle" fill="#1d4ed8" font-size="11">auto-promote no</text>
  <text x="255" y="172" text-anchor="middle" fill="#334155" font-size="10.5">no accidental</text>
  <text x="255" y="187" text-anchor="middle" fill="#334155" font-size="10.5">Primary on a</text>
  <text x="255" y="202" text-anchor="middle" fill="#334155" font-size="10.5">device open /</text>
  <text x="255" y="217" text-anchor="middle" fill="#334155" font-size="10.5">mount / probe</text>
  <text x="255" y="250" text-anchor="middle" fill="#64748b" font-size="10">only bedrock-d</text>
  <text x="255" y="264" text-anchor="middle" fill="#64748b" font-size="10">ever promotes</text>

  <!-- gate 2 -->
  <rect x="360" y="90" width="150" height="240" rx="8" fill="#fef3e8" stroke="#f3cf9a"/>
  <text x="435" y="116" text-anchor="middle" font-weight="700" fill="#b45309">Gate 2</text>
  <text x="435" y="134" text-anchor="middle" fill="#b45309" font-size="11">quorum all +</text>
  <text x="435" y="149" text-anchor="middle" fill="#b45309" font-size="11">suspend-io</text>
  <text x="435" y="185" text-anchor="middle" fill="#334155" font-size="10.5">lose any peer</text>
  <text x="435" y="200" text-anchor="middle" fill="#334155" font-size="10.5">→ FREEZE</text>
  <text x="435" y="234" text-anchor="middle" fill="#64748b" font-size="10">both sides</text>
  <text x="435" y="248" text-anchor="middle" fill="#64748b" font-size="10">freeze first;</text>
  <text x="435" y="262" text-anchor="middle" fill="#64748b" font-size="10">nobody writes</text>
  <text x="435" y="276" text-anchor="middle" fill="#64748b" font-size="10">during the vote</text>

  <!-- gate 3 -->
  <rect x="540" y="90" width="150" height="240" rx="8" fill="#f3f0fb" stroke="#cbb9f0"/>
  <text x="615" y="116" text-anchor="middle" font-weight="700" fill="#6d28d9">Gate 3</text>
  <text x="615" y="134" text-anchor="middle" fill="#6d28d9" font-size="11">fence-peer</text>
  <text x="615" y="149" text-anchor="middle" fill="#6d28d9" font-size="11">verdict</text>
  <text x="615" y="185" text-anchor="middle" fill="#334155" font-size="10.5">resume only on</text>
  <text x="615" y="200" text-anchor="middle" fill="#334155" font-size="10.5">exit 4 (WIN)</text>
  <text x="615" y="234" text-anchor="middle" fill="#64748b" font-size="10">minority read</text>
  <text x="615" y="248" text-anchor="middle" fill="#64748b" font-size="10">has no quorum</text>
  <text x="615" y="262" text-anchor="middle" fill="#64748b" font-size="10">→ lose/undecided</text>
  <text x="615" y="276" text-anchor="middle" fill="#64748b" font-size="10">→ stays frozen</text>

  <!-- gate 4 -->
  <rect x="720" y="90" width="150" height="240" rx="8" fill="#eef6f0" stroke="#bfe3c4"/>
  <text x="795" y="116" text-anchor="middle" font-weight="700" fill="#15803d">Gate 4</text>
  <text x="795" y="134" text-anchor="middle" fill="#15803d" font-size="11">exclusive</text>
  <text x="795" y="149" text-anchor="middle" fill="#15803d" font-size="11">witness claim</text>
  <text x="795" y="185" text-anchor="middle" fill="#334155" font-size="10.5">even split →</text>
  <text x="795" y="200" text-anchor="middle" fill="#334155" font-size="10.5">one claimant</text>
  <text x="795" y="234" text-anchor="middle" fill="#64748b" font-size="10">the tie-break</text>
  <text x="795" y="248" text-anchor="middle" fill="#64748b" font-size="10">can be held by</text>
  <text x="795" y="262" text-anchor="middle" fill="#64748b" font-size="10">exactly one side</text>

  <!-- flow arrows -->
  <line x1="150" y1="210" x2="178" y2="210" stroke="#64748b" marker-end="url(#a2)"/>
  <line x1="330" y1="210" x2="358" y2="210" stroke="#64748b" marker-end="url(#a2)"/>
  <line x1="510" y1="210" x2="538" y2="210" stroke="#64748b" marker-end="url(#a2)"/>
  <line x1="690" y1="210" x2="718" y2="210" stroke="#64748b" marker-end="url(#a2)"/>

  <text x="450" y="370" text-anchor="middle" font-size="12.5" fill="#334155">A minority write is stopped at Gate 2 (freeze) and never cleared by Gate 3 (no winning verdict).</text>
  <text x="450" y="392" text-anchor="middle" font-size="12.5" fill="#334155">Gate 4 ensures that even a 2-vs-2 split still yields exactly one "leader", so exactly one node clears Gate 3.</text>
  <text x="450" y="414" text-anchor="middle" font-size="11" fill="#94a3b8">Independent layers: a bug in any one gate still leaves the others standing.</text>
</svg>
